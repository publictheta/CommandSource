name: build

on:
  push:
    branches:
      - main
    tags:
      - "*.*.*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # `.icon`（Icon Composer 形式）のビルドには Xcode 26 以降が必要
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build
        run: xcodebuild install -scheme CommandSource DSTROOT=build/root

      - name: Package
        run: |
          hdiutil create \
            -fs APFS \
            -srcfolder build/root/Applications/CommandSource.app \
            -volname CommandSource \
            build/CommandSource.dmg

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/CommandSource.dmg --generate-notes
